    <rect x="214" y="294" width="72" height="72" fill="#f0c49c"/>
    <rect x="228" y="320" width="14" height="14" fill="#232323"/>
    <rect x="258" y="320" width="14" height="14" fill="#232323"/>
    <rect x="228" y="420" width="28" height="68" fill="#243d7a"/>
    <rect x="256" y="420" width="28" height="68" fill="#263f82"/>
    <rect x="174" y="374" width="32" height="90" fill="#f0c49c"/>
    <rect x="294" y="374" width="32" height="90" fill="#f0c49c"/>
    <rect x="216" y="290" width="68" height="22" fill="#3b2518"/>
    <text x="250" y="536" text-anchor="middle" fill="#1e2721" class="mono" font-size="22">PLAYER 01</text>
  </g>

  <g class="pixel" filter="url(#shadow)">
    <rect x="428" y="382" width="104" height="86" fill="#9b5b2d"/>
    <rect x="428" y="382" width="104" height="22" fill="#d48a3c"/>
    <rect x="468" y="412" width="24" height="28" fill="#f5c542"/>
    <rect x="424" y="378" width="112" height="8" fill="#5e351f"/>
    <text x="480" y="516" text-anchor="middle" fill="#1e2721" class="mono" font-size="22">SKILLS</text>
  </g>

  <g class="pixel" filter="url(#shadow)">
    <rect x="610" y="348" width="150" height="130" fill="#6b4428"/>
    <rect x="622" y="360" width="126" height="106" fill="#a66d3d"/>
    <rect x="646" y="328" width="80" height="36" fill="#7e5534"/>
    <rect x="646" y="386" width="32" height="32" fill="#3a2418"/>
    <rect x="694" y="386" width="32" height="32" fill="#3a2418"/>
    <rect x="646" y="428" width="80" height="18" fill="#3a2418"/>
    <text x="685" y="516" text-anchor="middle" fill="#1e2721" class="mono" font-size="22">CRAFT</text>
  </g>

  <g class="pixel" filter="url(#shadow)">
    <rect x="838" y="398" width="128" height="72" fill="#596168"/>
    <rect x="854" y="374" width="96" height="34" fill="#76818a"/>
    <rect x="866" y="412" width="22" height="22" fill="#38f8b4"/>
    <rect x="904" y="412" width="22" height="22" fill="#f5c542"/>
