<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Facundo Solis voxel game world</title>
  <desc id="desc">A Minecraft-inspired one-screen profile world with player, hotbar, blocks, portals and skill areas.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fb7ff"/>
      <stop offset="0.55" stop-color="#b7e5ff"/>
      <stop offset="1" stop-color="#eaf8ff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46c65a"/>
      <stop offset="1" stop-color="#1f8f3c"/>
    </linearGradient>
    <linearGradient id="dirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a6335"/>
      <stop offset="1" stop-color="#6b3f24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="0" flood-color="#000000" flood-opacity=".22"/>
    </filter>
    <style>
      .pixel { shape-rendering: crispEdges; }
      .mono { font-family: "Courier New", monospace; font-weight: 800; letter-spacing: 0; }
      .small { font-family: "Courier New", monospace; font-weight: 700; letter-spacing: 0; }
    </style>
  </defs>

  <rect width="1400" height="760" fill="url(#sky)"/>
  <rect x="0" y="0" width="1400" height="760" fill="#ffffff" opacity=".08"/>

  <g class="pixel" opacity=".95">
    <rect x="112" y="88" width="64" height="64" fill="#fff6b0"/>
    <rect x="128" y="88" width="16" height="64" fill="#ffe46b"/>
    <rect x="112" y="104" width="64" height="16" fill="#ffe46b"/>
    <rect x="128" y="104" width="32" height="32" fill="#fff099"/>
  </g>

  <g class="pixel" opacity=".55">
    <rect x="940" y="80" width="220" height="34" fill="#ffffff"/>
    <rect x="980" y="48" width="112" height="32" fill="#ffffff"/>
    <rect x="1048" y="114" width="86" height="32" fill="#ffffff"/>
    <rect x="214" y="172" width="182" height="32" fill="#ffffff"/>
    <rect x="260" y="140" width="96" height="32" fill="#ffffff"/>
  </g>

  <g class="pixel">
    <rect x="0" y="488" width="1400" height="96" fill="url(#grass)"/>
    <rect x="0" y="584" width="1400" height="176" fill="url(#dirt)"/>
    <g opacity=".28">
      <rect x="44" y="612" width="54" height="38" fill="#c1844a"/>
      <rect x="152" y="672" width="54" height="38" fill="#57331f"/>
      <rect x="306" y="618" width="54" height="38" fill="#c1844a"/>
      <rect x="486" y="694" width="54" height="38" fill="#57331f"/>
      <rect x="692" y="622" width="54" height="38" fill="#c1844a"/>
      <rect x="912" y="684" width="54" height="38" fill="#57331f"/>
      <rect x="1138" y="622" width="54" height="38" fill="#c1844a"/>
      <rect x="1278" y="688" width="54" height="38" fill="#57331f"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="90" y="72" width="760" height="190" fill="#1e2721"/>
    <rect x="102" y="84" width="736" height="166" fill="#26372c"/>
    <rect x="102" y="84" width="736" height="18" fill="#38f8b4"/>
    <text x="132" y="140" fill="#f5c542" class="mono" font-size="38">FACUNDO SOLIS</text>
    <text x="134" y="180" fill="#ecf4df" class="mono" font-size="25">FULL-STACK AI ENGINEER</text>
    <text x="134" y="218" fill="#bfe9d0" class="small" font-size="22">SAAS  /  AI  /  WEB  /  MOBILE  /  AUTOMATION</text>
  </g>

  <g class="pixel" filter="url(#shadow)">
    <rect x="1040" y="268" width="72" height="72" fill="#2b1b66"/>
    <rect x="1112" y="268" width="72" height="72" fill="#5f2ddb"/>
    <rect x="1112" y="340" width="72" height="72" fill="#2b1b66"/>
    <rect x="1040" y="340" width="72" height="72" fill="#8d4cff"/>
    <rect x="1056" y="284" width="112" height="112" fill="#11172b"/>
    <rect x="1074" y="302" width="76" height="76" fill="#7cf7ff"/>
    <text x="1109" y="440" text-anchor="middle" fill="#1e2721" class="mono" font-size="22">AI PORTAL</text>
  </g>

  <g class="pixel" filter="url(#shadow)">
